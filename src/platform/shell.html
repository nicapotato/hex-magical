  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  -webkit-font-smoothing: none;
  animation: waveBounce 1.15s ease-in-out infinite;

    <div id="loading"><div class="loading-wave" id="loading-wave" aria-hidden="true"></div><div id="loading-progress" aria-live="polite"></div></div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script>
/* WASM_LOADING_WAVE_JS */
(function () {
  var wave = document.getElementById("loading-wave");
  if (wave && !wave.childElementCount) {
    var word = "DOWNLOADING";
    for (var i = 0; i < word.length; i++) {
      var s = document.createElement("span");
      s.textContent = word.charAt(i);
      wave.appendChild(s);
    }
  }
  window.__wasmLoadingFormatProgress = function (loaded, total) {
    // Dependency counts stay unitless (Emscripten: "1/3"). Byte totals are >= 1 KiB.
    if (total < 1024) {
      return Math.round(loaded) + " / " + Math.round(total);
    }
    if (total < 1024 * 1024) {
      return Math.round(loaded / 1024) + " / " + Math.round(total / 1024) + " KB";
    }
    return (
      (loaded / (1024 * 1024)).toFixed(2) +
      " / " +
      (total / (1024 * 1024)).toFixed(2) +
      " MB"
    );
  };
  window.__wasmLoadingApplyStatus = function (text) {
    var loading = document.getElementById("loading");
    var progress = document.getElementById("loading-progress");
    if (!loading || !progress) return;
    if (!text) {
      loading.hidden = true;
      progress.textContent = "";
      return;
    }
    loading.hidden = false;
    var m = String(text).match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);
    if (m) {
      progress.textContent = window.__wasmLoadingFormatProgress(
        parseFloat(m[1]),
        parseFloat(m[2])
      );
    } else {
      var cleaned = String(text).replace(/^Downloading(\s+data)?\.\.\.\s*/i, "").trim();
      progress.textContent = cleaned || "";
    }
  };
})();
/* WASM_LOADING_WAVE_JS_END */
</script>
    <script type='text/javascript'>
      // Keep the canvas framebuffer matched to the browser/itch iframe viewport.
      // Raylib's FLAG_WINDOW_RESIZABLE also syncs GetScreenWidth/Height on resize.
      function resizeCanvas() {
          var canvas = document.getElementById('canvas');
          if (!canvas) return;

          // Match raylib's web resize callback (window.innerWidth/Height) so the
          // CSS size, framebuffer, and GetScreenWidth/Height stay in lockstep.
          var finalW = Math.max(1, Math.floor(window.innerWidth));
          var finalH = Math.max(1, Math.floor(window.innerHeight));

          if (canvas.width !== finalW) canvas.width = finalW;
          if (canvas.height !== finalH) canvas.height = finalH;
          canvas.style.width = finalW + 'px';
          canvas.style.height = finalH + 'px';
      }

      var Module = {
        print: function(text) {
          console.log(text);
        },
        printErr: function(text) {
          console.warn(text);
        },
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) {
            alert('WebGL context lost. You will need to reload the page.');
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: "" };
          if (text === Module.setStatus.last.text) return;
          var now = Date.now();
          var isProgress = /\d+\s*\/\s*\d+/.test(text || "");
          if (isProgress && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (text) console.log(text);
          window.__wasmLoadingApplyStatus(text);
        },
        onRuntimeInitialized: function() {
            window.__wasmLoadingApplyStatus("");
          var loadingDiv = document.getElementById('loading');
          if (loadingDiv) loadingDiv.style.display = 'none';

          window.focus();
          document.getElementById('canvas').focus();
          resizeCanvas();
        }
      };

      window.addEventListener('resize', resizeCanvas);
      window.addEventListener('orientationchange', resizeCanvas);
      if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', resizeCanvas);
      }
      document.addEventListener('DOMContentLoaded', resizeCanvas);

      document.addEventListener('touchmove', function(e) {
          e.preventDefault();
      }, { passive: false });
    </script>
